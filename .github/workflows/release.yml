name: release
on:
  push:
    tags: ['v*']
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # the release
      id-token: write      # the attestations' signing certificate
      attestations: write
      artifact-metadata: write
    steps:
      # actions pinned by commit: a moved tag can't change what builds the binaries
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build
        run: |
          v=${GITHUB_REF_NAME#v}
          [ "$(sed -n 's/^VERSION=//p' bin/izumo)" = "$v" ] || { echo "bin/izumo says VERSION=$(sed -n 's/^VERSION=//p' bin/izumo), tag is $v"; exit 1; }
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*} arch=${t#*/} ext=
            if [ "$os" = windows ]; then ext=.exe; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$v" \
              -o "dist/izumo_${os}_$arch$ext" ./cmd/izumo
          done
          (cd dist && sha256sum * > checksums.txt)
      # provenance: gh attestation verify <binary> --repo migueww/izumo proves this workflow built it
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/izumo_*
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
